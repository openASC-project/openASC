name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_site.py --check
      - run: node --check site/app.js
      - run: node --check viewer/viewer.js
      - run: node --check viewer/dds.js
      - run: node --test tests/test_dds.cjs
