name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_site.py --check
      - run: node --check site/app.js
      - run: node --check tools/prototype/viewer/viewer.js
      - run: node --check tools/prototype/viewer/dds.js
      - run: node --check tools/prototype/viewer/drive.js
      - run: node --test tests/test_dds.cjs
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Rust with formatting and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --workspace --locked
      - run: cargo +stable build --workspace --locked
      - name: Compare native and Python contracts on original fixtures
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tools/check_native_parity.py --native target/debug/openasc.exe
          else
            python tools/check_native_parity.py --native target/debug/openasc
          fi
      - name: Install software Vulkan for headless GPU verification
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers xvfb libxkbcommon-x11-0
      - name: Verify rasterization, depth, readback and PNG on software Vulkan
        if: runner.os == 'Linux'
        env:
          OPENASC_TEST_FALLBACK: '1'
          XDG_RUNTIME_DIR: /tmp
        run: cargo +stable test -p asc-render --locked --test gpu -- --ignored --nocapture
      - name: Verify native surface presentation, resize and readback under Xvfb
        if: runner.os == 'Linux'
        env:
          OPENASC_TEST_FALLBACK: '1'
          XDG_RUNTIME_DIR: /tmp
        run: xvfb-run -a cargo +stable test -p asc-app --locked --test window -- --ignored --nocapture
